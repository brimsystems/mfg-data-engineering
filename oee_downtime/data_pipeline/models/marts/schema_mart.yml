version: 2

models:

  # ── mart_oee__machine_performance ─────────────────────────────────────────
  - name: mart_oee__machine_performance
    description: >
      OEE decomposed into Availability, Performance, and Quality Rate by machine,
      shift, and day. Grain: one row per (machine_id, shift, period_date).
    columns:
      - name: performance_key
        tests:
          - not_null
          - unique
      - name: availability
        tests:
          - not_null
      - name: performance
        tests:
          - not_null
      - name: oee
        tests:
          - not_null
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "oee >= 0 and oee <= 1"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(oee - round(availability * performance * quality_rate, 4)) < 0.001"

  # ── mart_oee__downtime_analysis ───────────────────────────────────────────
  - name: mart_oee__downtime_analysis
    description: >
      Unified unplanned-downtime fact from MachineMetrics state intervals and
      Limble unplanned repairs. Grain: one row per downtime event.
    columns:
      - name: downtime_key
        tests:
          - not_null
          - unique
      - name: source_system
        tests:
          - accepted_values:
              arguments:
                values: ['MACHINE_STATE', 'CMMS_REPAIR']
      - name: machine_id
        tests:
          - relationships:
              arguments:
                to: ref('int_dim_machines')
                field: machine_id
      - name: failure_code
        tests:
          - accepted_values:
              arguments:
                values: ['TOOLING', 'MECHANICAL', 'ELECTRICAL', 'OPERATOR_INDUCED', 'ENVIRONMENTAL']
              config:
                where: "source_system = 'CMMS_REPAIR'"
      - name: downtime_hours
        tests:
          - not_null
      - name: is_shift_startup
        tests:
          - not_null

  # ── mart_oee__pm_compliance ───────────────────────────────────────────────
  - name: mart_oee__pm_compliance
    description: >
      Preventive-maintenance compliance and current tracker status. Grain: one
      row per machine.
    columns:
      - name: machine_id
        tests:
          - not_null
          - unique
      - name: pct_ontime
        tests:
          - not_null
      - name: pm_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Overdue', 'Due Soon', 'On Track']

  # ── mart_oee__operator_setup ──────────────────────────────────────────────
  - name: mart_oee__operator_setup
    description: >
      Operator setup-time summary versus the machinist cohort median. Grain: one
      row per machinist.
    columns:
      - name: operator_id
        tests:
          - not_null
          - unique
      - name: total_jobs
        tests:
          - not_null
      - name: median_setup_hours
        tests:
          - not_null
      - name: setup_ratio_vs_cohort
        tests:
          - not_null

  # ── mart_ml__health_features ──────────────────────────────────────────────
  - name: mart_ml__health_features
    description: >
      Feature table for the machine health indicator. Grain: one row per
      (machine_id, observation_date, shift). Backward-looking features and two
      forward-looking targets: an unplanned repair opening within 7 and within 21
      days. A target is null where the window runs past the end of the record.
    columns:
      - name: observation_key
        tests:
          - not_null
          - unique
      - name: machine_id
        tests:
          - not_null
      - name: observation_date
        tests:
          - not_null
      - name: machine_type
        tests:
          - not_null
      - name: rolling_7d_unplanned_downtime_hours
        tests:
          - not_null
      - name: rolling_7d_alarm_count
        tests:
          - not_null
      - name: rolling_30d_alarm_count
        tests:
          - not_null
      - name: count_late_pms_last_6m
        tests:
          - not_null
      - name: target_failure_7d
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: target_failure_21d
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [machine_id, observation_date, shift]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "coalesce(target_failure_7d, 0) <= coalesce(target_failure_21d, 1)"
