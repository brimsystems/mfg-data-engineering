job_costing:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Relative to the data_pipeline directory, where dbt is invoked.
      path: ../data_source/job_costing.duckdb
      threads: 1
      # One DuckDB thread, so sums add in the same order on every build.
      settings:
        threads: 1
