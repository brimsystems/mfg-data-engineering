version: 2

models:
  - name: fct_job_cost
    description: >
      One row per job and version (raw, cleaned, restructured): estimate by element,
      actual by element, variance, contribution and margin, coverage and source tags.
    columns:
      - name: job_id
        tests: [not_null]
      - name: version
        tests:
          - accepted_values:
              values: ['raw', 'cleaned', 'restructured']
      - name: act_total_cost
        tests: [not_null]

  - name: fct_job_cost_elements
    columns:
      - name: job_id
        tests: [not_null]
      - name: element
        tests:
          - accepted_values:
              values: ['material', 'labor', 'outside', 'scrap']
      - name: source
        tests:
          - accepted_values:
              values: ['erp', 'machine', 'clock', 'scan', 'issue', "issue, corrected to part need",
                       'PO', 'PO, attributed', 'GL residual, allocated', 'standard-fallback', 'unrepairable']

  - name: mart_margin_by_job
    columns:
      - name: job_id
        tests: [unique, not_null]
      - name: price
        tests: [not_null]

  - name: mart_repricing_queue
    columns:
      - name: part_number
        tests: [unique, not_null]
      - name: current_unit_cost
        tests: [not_null]
      - name: decision
        tests:
          - accepted_values:
              values: ['reprice', 'hold', 'exit', 'pending']

  - name: mart_dq_error_summary
    columns:
      - name: error_code
        tests: [unique, not_null]
      - name: table_rows
        tests: [not_null]

  - name: mart_coverage_weekly
    columns:
      - name: engagement_week
        tests: [unique, not_null]

  - name: mart_job_shortfall
    description: "Each job's shortfall to target contribution, split exactly into the price at the estimate and the actual over the estimate by element (estimate re-costed at today's prices), and assigned to named causes, not attributable, and offsets."
    columns:
      - name: job_id
        tests: [unique, not_null]
      - name: shortfall
        tests: [not_null]

  - name: mart_job_cause
    description: "The shortfall on each job by cause, one row per job and cause, with the primary cause and the action it maps to."
    columns:
      - name: job_id
        tests: [not_null]
      - name: cause
        tests: [not_null]

  - name: mart_inprogress_replay
    description: "The in-progress variance flag replayed over completed jobs: where on the routing it fired, how many days before ship, and what the shop could have done with it."
    columns:
      - name: job_id
        tests: [unique, not_null]

  - name: mart_part_margin_spread
    description: "Repeat parts with three or more jobs in the analysis year: every job with what could explain its margin against the part's other jobs."
    columns:
      - name: job_id
        tests: [unique, not_null]

  - name: mart_engagement_actions
    description: "The actions the owner decided on the diagnostic's findings, taken and not taken, with the reason for those not taken."
    columns:
      - name: action_id
        tests: [unique, not_null]

  - name: mart_job_variance
    description: "One row per completed job: estimated and actual cost by element, ratios, margin, shortfall and the shortfall allocated to elements by the reporting layer's rule."
    columns:
      - name: job_id
        tests: [unique, not_null]

  - name: mart_job_driver
    description: "The driver and second driver of each completed job's variance, assigned by rule, with the action and its status."
    columns:
      - name: job_id
        tests: [unique, not_null]
      - name: driver
        tests: [not_null]

  - name: mart_job_variance_by_work_center
    description: "Setup and run hours against estimate by completed job and work center, where the operation ran on one machine."

  - name: mart_job_variance_monthly
    description: "The period summary by completion month for the Month grouping and the 13-month shortfall chart."
    columns:
      - name: completion_month
        tests: [unique, not_null]
