[project]
name = "mfg-job-costing"
version = "0.1.0"
description = "ERP job costing and margin analytics for a precision machining shop."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "faker>=20.0",
    "duckdb>=0.10",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "prefect>=3.0",
    "matplotlib>=3.8",
    "python-docx>=1.1",
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["data_source", "analytics"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
